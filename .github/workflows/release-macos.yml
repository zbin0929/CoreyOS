name: Release (macOS universal)

# Builds a universal-apple-darwin .dmg that runs on both Intel and
# Apple Silicon Macs. Manually-triggered only — bump version + create
# a draft Release matching the tag, then dispatch this workflow with
# that tag as `release_tag`.
#
# Cost: this repo is PUBLIC, so all GitHub Actions minutes (including
# macOS) are free. No pay-as-you-go to worry about.
#
# What this builds:
#   - Universal `Corey.app` (Intel x86_64 + arm64 fat binary)
#   - `Corey_<version>_universal.dmg` mounted installer
#   - Signed updater artifacts (`.zip` + `.sig`) — read by the
#     Tauri updater plugin from the GitHub Release `latest.json`
#     endpoint.
#
# What this does NOT do:
#   - Apple Developer ID signing / notarization. Users will see the
#     Gatekeeper "unidentified developer" prompt on first open and
#     need to right-click → Open. Buying an Apple Developer
#     account ($99/yr) + threading the cert through GitHub
#     Actions secrets would close that gap; we punt that until a
#     real customer asks.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to attach the .dmg to (e.g. v0.1.0). Must already exist.'
        required: true
        type: string

jobs:
  build-macos-universal:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Universal binary needs both targets installed even when
      # the host is one of them (the linker has to know about both
      # ABIs to weave the fat binary).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-universal

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      # Build hermes-standalone with PyInstaller for one-click install
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build hermes-standalone
        run: |
          set -e  # 任何命令失败立即退出
          
          echo "Installing Hermes and PyInstaller..."
          # aiohttp is a lazy/optional dep since Hermes v0.14.0, so it is NOT
          # pulled in by `pip install hermes-agent`. The gateway's api_server
          # adapter (Corey's /v1/runs SSE) hard-requires it — install it
          # explicitly so PyInstaller's --collect-all aiohttp has something to
          # bundle, otherwise the standalone binary ships without it and the
          # gateway boots with "aiohttp not installed / no adapter for api_server".
          pip install hermes-agent aiohttp pyinstaller
          python -c "import aiohttp; print('aiohttp', aiohttp.__version__, 'present for bundling')"
          
          echo "Patching ssl_guard.py for stale CA auto-heal..."
          python scripts/patch-hermes-ssl-guard.py || echo "WARN: ssl_guard patch failed"
          
          echo "Creating entry point script..."
          cat > /tmp/hermes_entry.py << 'ENTRY_EOF'
          import sys
          import re
          from hermes_cli.main import main
          if __name__ == "__main__":
              sys.argv[0] = re.sub(r'(-script\.pyw|\.exe)?$', '', sys.argv[0])
              sys.exit(main())
          ENTRY_EOF
          
          echo "Building hermes-standalone..."
          mkdir -p src-tauri/binaries
          pyinstaller \
            --onefile \
            --name hermes-standalone \
            --distpath src-tauri/binaries \
            --workpath /tmp/pyinstaller-build \
            --specpath /tmp/pyinstaller-build \
            --clean \
            --noconfirm \
            --collect-all hermes_cli \
            --collect-all hermes_agent \
            --collect-all aiohttp \
            --collect-all openai \
            --collect-all httpx \
            --collect-all rich \
            --collect-all tenacity \
            --collect-all yaml \
            --collect-all ruamel.yaml \
            --collect-all requests \
            --collect-all jinja2 \
            --collect-all pydantic \
            --collect-all pydantic_core \
            --collect-all prompt_toolkit \
            --collect-all croniter \
            --collect-all jwt \
            --collect-all psutil \
            --collect-all dotenv \
            --collect-all fire \
            --collect-all certifi \
            --collect-all packaging \
            --collect-all markdown \
            --collect-all urllib3 \
            --collect-all cryptography \
            --hidden-import hermes_cli \
            --hidden-import hermes_cli.main \
            --hidden-import hermes_agent \
            --hidden-import aiohttp \
            --runtime-hook scripts/hermes-runtime-hook.py \
            --collect-submodules tools \
            --collect-submodules agent \
            --collect-submodules gateway \
            /tmp/hermes_entry.py
          
          echo "Verifying build..."
          ls -lh src-tauri/binaries/
          
          # 验证二进制存在且可执行
          if [ ! -f "src-tauri/binaries/hermes-standalone" ]; then
            echo "ERROR: hermes-standalone not found!"
            exit 1
          fi
          
          src-tauri/binaries/hermes-standalone --version
          echo "hermes-standalone build successful!"

      # Tauri-action's `args` flag passes the universal target
      # through to `tauri build`. Output lands at
      # `src-tauri/target/universal-apple-darwin/release/bundle/`.
      - name: Build + attach to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.release_tag }}
          releaseName: 'Corey ${{ inputs.release_tag }}'
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin

      - name: Upload macOS artifacts to COS
        run: |
          TAG="${{ inputs.release_tag }}"
          BUCKET="${{ secrets.COS_BUCKET }}"
          BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle"
          
          brew install coscli 2>/dev/null || true
          if ! command -v coscli &>/dev/null; then
            curl -sL https://cosbrowser.cloud.tencent.com/software/coscli/coscli-darwin-arm64 -o /usr/local/bin/coscli
            chmod +x /usr/local/bin/coscli
          fi
          
          echo "Uploading macOS artifacts to COS..."
          coscli cp "${BUNDLE_DIR}/dmg/" "cos://${BUCKET}/releases/${TAG}/" -r \
            -i "${{ secrets.COS_SECRET_ID }}" -k "${{ secrets.COS_SECRET_KEY }}" -e "cos.accelerate.myqcloud.com" || true
          
          # Rename to match GitHub Release filename (Tauri uses Corey.app.tar.gz locally but uploads as Corey_universal.app.tar.gz)
          if [ -f "${BUNDLE_DIR}/macos/Corey.app.tar.gz" ]; then
            mv "${BUNDLE_DIR}/macos/Corey.app.tar.gz" "${BUNDLE_DIR}/macos/Corey_universal.app.tar.gz"
          fi
          if [ -f "${BUNDLE_DIR}/macos/Corey.app.tar.gz.sig" ]; then
            mv "${BUNDLE_DIR}/macos/Corey.app.tar.gz.sig" "${BUNDLE_DIR}/macos/Corey_universal.app.tar.gz.sig"
          fi
          
          coscli cp "${BUNDLE_DIR}/macos/" "cos://${BUCKET}/releases/${TAG}/" -r \
            -i "${{ secrets.COS_SECRET_ID }}" -k "${{ secrets.COS_SECRET_KEY }}" -e "cos.accelerate.myqcloud.com" || true
          
          echo "Files uploaded to cos://${BUCKET}/releases/${TAG}/"

      - name: Upload latest.json to COS (with COS URLs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          BUCKET="${{ secrets.COS_BUCKET }}"
          REGION="cos.accelerate.myqcloud.com"
          COS_BASE="https://${BUCKET}.${REGION}/releases/${TAG}"

          LATEST_JSON_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}"
          ASSET_URL=$(curl -sL -H "Authorization: token ${GITHUB_TOKEN}" "${LATEST_JSON_URL}" \
            | python3 -c "import sys,json; assets=json.load(sys.stdin).get('assets',[]); print(next((a['browser_download_url'] for a in assets if a['name']=='latest.json'),''))")

          if [ -n "${ASSET_URL}" ]; then
            curl -sL "${ASSET_URL}" -o latest.json
          else
            echo "latest.json not found in release assets, skipping"
            exit 0
          fi

          python3 -c "
          import json
          data = json.load(open('latest.json'))
          base = '${COS_BASE}'
          for p in data.get('platforms', {}).values():
              old_url = p.get('url', '')
              filename = old_url.split('/')[-1] if '/' in old_url else old_url
              p['url'] = f'{base}/{filename}'
          json.dump(data, open('latest.json', 'w'), indent=2)
          "

          echo "Uploading latest.json to COS..."
          coscli cp latest.json "cos://${BUCKET}/releases/latest.json" \
            -i "${{ secrets.COS_SECRET_ID }}" -k "${{ secrets.COS_SECRET_KEY }}" -e "${REGION}"
          echo "latest.json uploaded — URLs rewritten to COS"
